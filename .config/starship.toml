add_newline = false

format = "$directory$character"

[directory]
style = "fg:#859289"
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = "⎇ "
style = "fg:#A7C080"
format = " [$symbol$branch]($style)"

[git_status]
style = "fg:#E67E80"
format = "[$all_status$ahead_behind]($style)"

[character]
success_symbol = "[λ](fg:#A7C080)"
error_symbol = "[λ](fg:#E67E80)"

# Disable noisy modules
[package]
disabled = true
[nodejs]
disabled = true
[python]
disabled = true
[java]
disabled = true
[gradle]
disabled = true
[cmd_duration]
disabled = true
