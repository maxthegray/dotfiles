# prefix is C-a; navigate panes with prefix + hjkl
set -g prefix C-a
bind C-a send-prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
set -g focus-events on

# Resize panes with prefix + arrow keys
bind Up resize-pane -U 5
bind Down resize-pane -D 5
bind Left resize-pane -L 5
bind Right resize-pane -R 5

# Status bar — Everforest Dark Dogbg palette
set -g mouse off
set -g status-position top
set -g status-interval 2
set -g status-style "bg=#252525,fg=#D3C6AA"
set -g status-left "#[fg=#A7C080,bold] #S #[fg=#3d3d3d]│#[fg=#859289] #{b:pane_current_path} #[fg=#3d3d3d]│"
set -g status-right "#(cat /tmp/tmux_branch_#{pane_id} 2>/dev/null)#(cat /tmp/claude_status_#{pane_id} 2>/dev/null)#[fg=#3d3d3d]│#[fg=#859289] #($HOME/.local/bin/pet render 2>/dev/null) #[fg=#3d3d3d]│#[fg=#859289] %d %b #[fg=#3d3d3d]│ #[fg=#D3C6AA]%H:%M "
set -g status-left-length 60
set -g status-right-length 120
set -g window-status-format "#[fg=#859289] #W "
set -g window-status-current-format "#[fg=#D3C6AA,bold] #W "
set -g window-status-separator ""
set -g automatic-rename on
set -g automatic-rename-format "#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}"
set -g pane-border-style "fg=#3d3d3d"
set -g pane-active-border-style "fg=#A7C080"
set -g message-style "bg=#252525,fg=#D3C6AA"

# Let inline image protocols (iTerm, Kitty) pass through tmux so serie's graph renders.
set -gq allow-passthrough on

# Cheatsheet popup. Prefix+? to open.
bind ? display-popup -E -w 60% -h 80% -x C -y C -T " cheatsheet " "cat ~/.config/cheatsheet | less -r"

# Floating git popups in top-right. Prefix+g = serie (pretty graph), Prefix+G = lazygit (branch ops).
bind g display-popup -E -w 75% -h 75% -x R -y 0 -d "#{pane_current_path}" -T " git graph " "lazygit log"
bind G display-popup -E -w 75% -h 75% -x R -y 0 -d "#{pane_current_path}" -T " lazygit " "lazygit"
