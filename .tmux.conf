# prefix is C-a; navigate panes with prefix + hjkl
set -g prefix C-a
bind C-a send-prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
set -g focus-events on

# Resize panes with prefix + arrow keys
bind Up resize-pane -U 5
bind Down resize-pane -D 5
bind Left resize-pane -L 5
bind Right resize-pane -R 5

# Status bar — values default to Everforest, then the generated theme overrides
# them. `theme <name>` rewrites the fragment and reloads this file.
set -g @termtheme_bg '#252525'
set -g @termtheme_fg '#D3C6AA'
set -g @termtheme_muted '#859289'
set -g @termtheme_border '#3D3D3D'
set -g @termtheme_accent '#A7C080'

set -g mouse off
set -g status-position top
set -g status-interval 2
set -g status-style "bg=#252525,fg=#D3C6AA"
set -g status-left "#[fg=#{@termtheme_accent},bold] #S #[fg=#{@termtheme_border}]│#[fg=#{@termtheme_muted}] #{b:pane_current_path} #[fg=#{@termtheme_border}]│"
set -g status-right "#($HOME/.local/bin/tmux-git-branch #{pane_id} #{pane_current_path} >/dev/null 2>&1; cat /tmp/tmux_branch_#{pane_id} 2>/dev/null)#(cat /tmp/claude_status_#{pane_id} 2>/dev/null)#{?#{m/r:^codex,#{pane_current_command}},#[fg=#{@termtheme_border}]│#[fg=#{@termtheme_muted}] #{pane_title} ,}#($HOME/.local/bin/tmux-fresh /tmp/codex_status_#{pane_id} 300)#($HOME/.local/bin/tmux-fresh /tmp/ollama_status 8)#[fg=#{@termtheme_border}]│#($HOME/.local/bin/pet render --tmux 2>/dev/null | sed 's/^/#[fg=#{@termtheme_muted}] /; s/$/ #[fg=#{@termtheme_border}]│/')#[fg=#{@termtheme_muted}] %d %b #[fg=#{@termtheme_border}]│ #[fg=#{@termtheme_fg}]%H:%M "
set -g status-left-length 60
set -g status-right-length 120
set -g window-status-format "#[fg=#{@termtheme_muted}] #W "
set -g window-status-current-format "#[fg=#{@termtheme_fg},bold] #W "
set -g window-status-separator ""
set -g automatic-rename on
set -g automatic-rename-format "#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}"
set -g pane-border-style "fg=#3D3D3D"
set -g pane-active-border-style "fg=#A7C080"
set -g message-style "bg=#252525,fg=#D3C6AA"
source-file -q ~/.cache/termtheme/tmux.conf

# Let inline image protocols (iTerm, Kitty) pass through tmux so serie's graph renders.
set -gq allow-passthrough on

# Cheatsheet popup. Prefix+? to open.
bind ? display-popup -E -w 60% -h 80% -x C -y C -T " cheatsheet " "cat ~/.config/cheatsheet | less -r"

# Floating git popups in top-right. Prefix+g = serie (pretty graph), Prefix+G = lazygit (branch ops).
bind g display-popup -E -w 75% -h 75% -x R -y 0 -d "#{pane_current_path}" -T " git graph " "lazygit log"
bind G display-popup -E -w 75% -h 75% -x R -y 0 -d "#{pane_current_path}" -T " lazygit " "lazygit"
